name: MTG Price Bot

on:
  schedule:
    - cron: "0 6 * * *"   # ogni giorno alle 06:00 UTC (07:00/08:00 in Italia)
  workflow_dispatch:       # permette l'avvio manuale dal pulsante "Run workflow"

permissions:
  contents: write          # serve per salvare lo storico nel repository

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le librerie
        run: pip install -r requirements.txt

      - name: Esegui il bot
        run: python bot.py
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Salva lo storico
        if: always()       # salva i dati anche se una parte del bot ha avuto un errore
        run: |
          git config user.name "mtg-bot"
          git config user.email "mtg-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Aggiorna storico" && git pull --rebase && git push)
