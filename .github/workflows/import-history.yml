name: Importa storico MTGJSON

on:
  workflow_dispatch:       # solo avvio manuale: si lancia una volta sola

permissions:
  contents: write

jobs:
  import-history:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le librerie
        run: pip install -r requirements.txt

      - name: Importa lo storico
        run: python import_history.py
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Salva lo storico importato
        if: success()
        run: |
          git config user.name "mtg-bot"
          git config user.email "mtg-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Importa storico MTGJSON" && git pull --rebase && git push)
